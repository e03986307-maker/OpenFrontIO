name: Validate OpenFront mod

on:
  push:
    branches:
      - mod-patch-work

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out mod branch
        uses: actions/checkout@v4
        with:
          ref: mod-patch-work
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install npm
        run: npm install --global npm@12.1.0
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run mod and snapshot tests
        run: npx vitest run tests/AirPowerMod.test.ts tests/core/snapshot/FullGameSnapshot.test.ts
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build-prod
