name: Apply and validate latest OpenFront mod

on:
  push:
    branches:
      - mod-patch-work-v2

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean base branch
        uses: actions/checkout@v4
        with:
          ref: mod-patch-work-v2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install npm
        run: npm install --global npm@12.1.0
      - name: Check and apply patch
        run: |
          git apply --recount --binary --check mod.patch
          git apply --recount --binary mod.patch
          rm mod.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply latest OpenFront mod patch"
          git push
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run mod and snapshot tests
        run: npx vitest run tests/AirPowerMod.test.ts tests/core/snapshot/FullGameSnapshot.test.ts
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build-prod
